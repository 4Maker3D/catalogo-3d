<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4Maker 3D — Acesso</title>
<style>
:root{--bg:#08090d;--panel:#111318;--panel2:#15171d;--line:#292c34;--text:#f2f3f5;--muted:#8d929d;--blue:#2d7cff;--blue2:#1b5ed0;--danger:#ff6262}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% -10%,#17233d 0,#0b0c11 42%,#07080b 100%);color:var(--text)}
body{display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);animation:rise .45s ease}.brand{text-align:center;margin-bottom:26px}.brand img{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:3px}.brand h1{font-size:25px;margin:17px 0 5px}.brand p{margin:0;color:var(--muted);font-size:14px}.card{background:rgba(17,19,24,.88);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 70px #0008;backdrop-filter:blur(16px)}label{display:block;font-size:13px;color:#b4b8c1;margin:0 0 8px}.field{margin-bottom:17px}input{width:100%;height:52px;border:1px solid #2a2d35;border-radius:14px;background:#0c0e13;color:var(--text);padding:0 15px;font-size:16px;outline:0}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2d7cff1c}button{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#3b8cff,#1e63d5);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;color:var(--danger);font-size:13px;margin:0 0 13px}.foot{text-align:center;color:#656b76;font-size:12px;margin-top:18px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="login">
  <div class="brand"><img src="logo.png" alt="4Maker 3D"><h1>Área administrativa</h1><p>Gerenciamento interno 4Maker 3D</p></div>
  <section class="card">
    <form id="form">
      <div class="field"><label for="user">Usuário</label><input id="user" autocomplete="username" required></div>
      <div class="field"><label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password" required></div>
      <p class="error" id="error"></p>
      <button id="submit" type="submit">ENTRAR</button>
    </form>
  </section>
  <div class="foot">Acesso restrito • 4Maker 3D</div>
</main>
<script>
const API_URL = 'https://4maker3d-admin-api.4makerimpressoes.workers.dev';
const form=document.getElementById('form'),error=document.getElementById('error'),submit=document.getElementById('submit');
(async()=>{try{const token=sessionStorage.getItem('4maker_session');if(!token)return;const r=await fetch(API_URL+'/api/session',{headers:{Authorization:'Bearer '+token}});if(r.ok)location.replace('painel.html#dashboard');else sessionStorage.removeItem('4maker_session')}catch{}})();
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='ENTRANDO...';try{const r=await fetch(API_URL+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Falha no login.');sessionStorage.setItem('4maker_session',d.token);location.replace('painel.html#dashboard')}catch(err){error.textContent=err.message}finally{submit.disabled=false;submit.textContent='ENTRAR'}});
</script>
</body>
</html>
