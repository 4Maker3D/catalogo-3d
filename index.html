<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>4Maker 3D</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #2B292A;

        }


        /* =================================
           CENA
        ================================= */

        body {

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #eeeeee
                );

            transition:
                background 0.4s ease;

        }


        canvas {

            display: block;

        }


        /* =================================
           LOGO
        ================================= */

        #brand {

            position: absolute;

            top: 20px;
            left: 22px;

            z-index: 20;

            width: 150px;

        }


        #brand img {

            width: 100%;

            height: auto;

            display: block;

        }


        /* =================================
           CONTROLES
        ================================= */

        #controls {

            position: absolute;

            top: 20px;
            right: 20px;

            z-index: 20;

            display: flex;

            gap: 8px;

        }


        .control {

            width: 44px;
            height: 44px;

            border: none;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.94);

            color: #2B292A;

            font-size: 19px;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.10);

            transition:
                transform 0.2s,
                background 0.2s,
                color 0.2s;

        }


        .control:hover {

            transform:
                translateY(-2px);

        }


        .control.active {

            background:
                #183765;

            color:
                white;

        }


        /* =================================
           MENU DE FUNDO
        ================================= */

        #backgroundMenu {

            position: absolute;

            top: 75px;
            right: 20px;

            z-index: 20;

            background:
                rgba(255,255,255,0.96);

            padding: 10px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.12);

            display: none;

        }


        #backgroundMenu.show {

            display: block;

        }


        .backgroundOption {

            display: block;

            width: 150px;

            border: none;

            background: transparent;

            padding: 9px 10px;

            border-radius: 8px;

            text-align: left;

            cursor: pointer;

            font-size: 13px;

        }


        .backgroundOption:hover {

            background:
                #f0f0f0;

        }


        /* =================================
           INSTRUÇÕES
        ================================= */

        #instructions {

            position: absolute;

            top: 82px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 10;

            padding: 7px 12px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.70);

            backdrop-filter:
                blur(8px);

            font-size: 11px;

            opacity: 0.65;

            pointer-events: none;

        }


        /* =================================
           PRODUTO
        ================================= */

        #productCard {

            position: absolute;

            left: 22px;
            bottom: 22px;

            width: 360px;

            max-width:
                calc(100% - 44px);

            padding: 22px;

            z-index: 20;

            background:
                rgba(255,255,255,0.95);

            backdrop-filter:
                blur(12px);

            border-radius: 18px;

            box-shadow:
                0 12px 40px
                rgba(0,0,0,0.13);

        }


        #category {

            color:
                #183765;

            font-size: 11px;

            font-weight: bold;

            letter-spacing:
                1.5px;

            text-transform:
                uppercase;

            margin-bottom: 7px;

        }


        #productName {

            font-size: 26px;

            font-weight: 600;

            margin-bottom: 9px;

        }


        #description {

            color:
                #666;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 16px;

        }


        .detail {

            font-size: 13px;

            line-height: 1.5;

            margin-top: 5px;

        }


        .detail strong {

            color:
                #2B292A;

        }


        /* =================================
           CORES
        ================================= */

        #colorsTitle {

            margin-top: 16px;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: bold;

        }


        #colors {

            display: flex;

            gap: 8px;

        }


        .colorButton {

            width: 25px;
            height: 25px;

            border-radius: 50%;

            border: 2px solid white;

            outline:
                1px solid #ccc;

            cursor: pointer;

        }


        .colorButton.active {

            outline:
                2px solid #183765;

            outline-offset: 2px;

        }


        /* =================================
           WHATSAPP
        ================================= */

        #whatsapp {

            display: block;

            margin-top: 18px;

            padding: 13px;

            border-radius: 10px;

            background:
                #183765;

            color: white;

            text-decoration: none;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            transition:
                0.2s;

        }


        #whatsapp:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.08);

        }


        /* =================================
           LOADING
        ================================= */

        #loading {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 100;

            background:
                #f4f4f4;

            font-size: 14px;

        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {


            #brand {

                top: 14px;
                left: 16px;

                width: 125px;

            }


            #controls {

                top: 14px;
                right: 14px;

            }


            .control {

                width: 40px;
                height: 40px;

                border-radius: 10px;

            }


            #instructions {

                display: none;

            }


            #productCard {

                left: 12px;
                bottom: 12px;

                width:
                    calc(100% - 24px);

                padding: 17px;

                border-radius: 16px;

            }


            #productName {

                font-size: 21px;

            }


            #description {

                font-size: 13px;

                margin-bottom: 10px;

            }


            #colorsTitle {

                margin-top: 12px;

            }


            #whatsapp {

                margin-top: 14px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         LOGO
    ================================= -->

    <div id="brand">

        <img
            src="logo.png"
            alt="4Maker 3D">

    </div>


    <!-- =================================
         CONTROLES
    ================================= -->

    <div id="controls">


        <button
            class="control"
            id="resetButton"
            title="Centralizar">

            ↺

        </button>


        <button
            class="control"
            id="rotateButton"
            title="Rotação automática">

            ▶

        </button>


        <button
            class="control"
            id="backgroundButton"
            title="Alterar fundo">

            ◐

        </button>


        <button
            class="control"
            id="fullscreenButton"
            title="Tela cheia">

            ⛶

        </button>


    </div>


    <!-- =================================
         FUNDOS
    ================================= -->

    <div id="backgroundMenu">


        <button
            class="backgroundOption"
            data-bg="light">

            Fundo claro

        </button>


        <button
            class="backgroundOption"
            data-bg="dark">

            Fundo escuro

        </button>


        <button
            class="backgroundOption"
            data-bg="studio">

            Estúdio

        </button>


        <button
            class="backgroundOption"
            data-bg="blue">

            Azul 4Maker

        </button>


    </div>


    <!-- =================================
         INSTRUÇÕES
    ================================= -->

    <div id="instructions">

        Arraste para girar • Pinça para aproximar

    </div>


    <!-- =================================
         INFORMAÇÕES
    ================================= -->

    <div id="productCard">


        <div id="category">

            Plantas e decoração

        </div>


        <div id="productName">

            Self-Watering 3

        </div>


        <div id="description">

            Modelo disponível para produção personalizada.

        </div>


        <div class="detail">

            <strong>Materiais:</strong>

            PLA • PETG • ABS

        </div>


        <div class="detail">

            <strong>Personalização:</strong>

            Cores e tamanhos sob consulta

        </div>


        <div id="colorsTitle">

            Cores disponíveis

        </div>


        <div id="colors">


            <button
                class="colorButton active"
                data-color="#FFFFFF"
                style="background:#FFFFFF">
            </button>


            <button
                class="colorButton"
                data-color="#2B292A"
                style="background:#2B292A">
            </button>


            <button
                class="colorButton"
                data-color="#183765"
                style="background:#183765">
            </button>


            <button
                class="colorButton"
                data-color="#D92B2B"
                style="background:#D92B2B">
            </button>


            <button
                class="colorButton"
                data-color="#D6A21E"
                style="background:#D6A21E">
            </button>


            <button
                class="colorButton"
                data-color="#3E8F55"
                style="background:#3E8F55">
            </button>


        </div>


        <a
            id="whatsapp"
            href="#"
            target="_blank">

            Solicitar orçamento

        </a>


    </div>


    <!-- =================================
         THREE.JS
    ================================= -->

    <script type="importmap">

    {

        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"

        }

    }

    </script>


    <script type="module">


        import * as THREE
        from 'three';


        import {
            OrbitControls
        }
        from
        'three/addons/controls/OrbitControls.js';


        import {
            STLLoader
        }
        from
        'three/addons/loaders/STLLoader.js';


        /* =================================
           PRODUTOS
        ================================= */

        const produtos = {


            "Self-Watering-3": {

                nome:
                    "Self-Watering 3",

                categoria:
                    "Plantas e decoração",

                descricao:
                    "Modelo disponível para produção personalizada.",

                materiais:
                    "PLA • PETG • ABS"

            },


            "vaso-01": {

                nome:
                    "Vaso Geométrico 01",

                categoria:
                    "Plantas e decoração",

                descricao:
                    "Vaso decorativo com design exclusivo.",

                materiais:
                    "PLA • PETG • ABS"

            }


        };


        /* =================================
           MODELO DA URL
        ================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const modeloNome =
            params.get("modelo")
            || "Self-Watering-3";


        const produto =
            produtos[modeloNome]
            || produtos["Self-Watering-3"];


        /* =================================
           INFORMAÇÕES
        ================================= */

        document.getElementById(
            "category"
        ).textContent =
            produto.categoria;


        document.getElementById(
            "productName"
        ).textContent =
            produto.nome;


        document.getElementById(
            "description"
        ).textContent =
            produto.descricao;


        document.querySelector(
            "#productCard .detail"
        ).innerHTML =
            "<strong>Materiais:</strong> "
            + produto.materiais;


        /* =================================
           WHATSAPP
        ================================= */

        const telefone =
            "5500000000000";


        const mensagem =
            "Olá! Gostaria de solicitar um orçamento para "
            + produto.nome;


        document.getElementById(
            "whatsapp"
        ).href =
            "https://wa.me/"
            + telefone
            + "?text="
            + encodeURIComponent(mensagem);


        /* =================================
           CENA
        ================================= */

        const scene =
            new THREE.Scene();


        /* =================================
           CÂMERA
        ================================= */

        const camera =
            new THREE.PerspectiveCamera(

                45,

                window.innerWidth /
                window.innerHeight,

                0.1,

                1000

            );


        camera.position.set(
            0,
            0,
            75
        );


        /* =================================
           RENDER
        ================================= */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                alpha: true

            });


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(
                window.devicePixelRatio,
                2
            )

        );


        document.body.appendChild(
            renderer.domElement
        );


        /* =================================
           CONTROLES
        ================================= */

        const controls =
            new OrbitControls(

                camera,

                renderer.domElement

            );


        controls.enableDamping =
            true;


        controls.dampingFactor =
            0.06;


        controls.enablePan =
            false;


        /* =================================
           LUZ
        ================================= */

        const keyLight =
            new THREE.DirectionalLight(
                0xffffff,
                4
            );


        keyLight.position.set(
            5,
            10,
            10
        );


        scene.add(
            keyLight
        );


        const fillLight =
            new THREE.DirectionalLight(
                0xffffff,
                2
            );


        fillLight.position.set(
            -10,
            5,
            5
        );


        scene.add(
            fillLight
        );


        const ambient =
            new THREE.AmbientLight(
                0xffffff,
                2
            );


        scene.add(
            ambient
        );


        /* =================================
           MODELO
        ================================= */

        let model = null;


        let automaticRotation =
            false;


        let initialPosition;


        let initialRotation;


        const loader =
            new STLLoader();


        loader.load(

            modeloNome + ".stl",


            function (geometry) {


                geometry.computeVertexNormals();


                geometry.center();


                const material =
                    new THREE.MeshStandardMaterial({

                        color:
                            0x777777,

                        metalness:
                            0.05,

                        roughness:
                            0.58

                    });


                model =
                    new THREE.Mesh(

                        geometry,

                        material

                    );


                scene.add(
                    model
                );


                /* =========================
                   ESCALA
                ========================= */

                const box =
                    new THREE.Box3()
                    .setFromObject(
                        model
                    );


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const maxDimension =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                model.scale.setScalar(
                    50 / maxDimension
                );


                /* =========================
                   ESTADO INICIAL
                ========================= */

                initialPosition =
                    model.position.clone();


                initialRotation =
                    model.rotation.clone();


                /* =========================
                   CÂMERA
                ========================= */

                camera.position.set(
                    0,
                    0,
                    75
                );


                controls.target.set(
                    0,
                    0,
                    0
                );


                controls.update();


                document.getElementById(
                    "loading"
                );


            },


            undefined,


            function (error) {

                console.error(
                    error
                );

            }

        );


        /* =================================
           CENTRALIZAR
        ================================= */

        document.getElementById(
            "resetButton"
        ).onclick = function () {


            if (!model)
                return;


            model.position.copy(
                initialPosition
            );


            model.rotation.copy(
                initialRotation
            );


            controls.reset();

        };


        /* =================================
           ROTAÇÃO
        ================================= */

        document.getElementById(
            "rotateButton"
        ).onclick = function () {


            automaticRotation =
                !automaticRotation;


            this.classList.toggle(
                "active",
                automaticRotation
            );


            this.textContent =
                automaticRotation
                ? "Ⅱ"
                : "▶";

        };


        /* =================================
           CORES
        ================================= */

        document.querySelectorAll(
            ".colorButton"
        ).forEach(

            button => {

                button.onclick =
                    function () {


                        if (!model)
                            return;


                        const color =
                            this.dataset.color;


                        model.material.color.set(
                            color
                        );


                        document
                            .querySelectorAll(
                                ".colorButton"
                            )
                            .forEach(
                                b =>
                                b.classList.remove(
                                    "active"
                                )
                            );


                        this.classList.add(
                            "active"
                        );

                    };

            }

        );


        /* =================================
           FUNDOS
        ================================= */

        const backgroundMenu =
            document.getElementById(
                "backgroundMenu"
            );


        document.getElementById(
            "backgroundButton"
        ).onclick = function () {

            backgroundMenu.classList.toggle(
                "show"
            );

        };


        document.querySelectorAll(
            ".backgroundOption"
        ).forEach(

            option => {

                option.onclick =
                    function () {


                        const bg =
                            this.dataset.bg;


                        if (bg === "light") {

                            document.body.style.background =
                                "linear-gradient(135deg,#ffffff,#eeeeee)";

                        }


                        if (bg === "dark") {

                            document.body.style.background =
                                "linear-gradient(135deg,#202124,#08090b)";

                        }


                        if (bg === "studio") {

                            document.body.style.background =
                                "radial-gradient(circle at 50% 35%,#ffffff,#dcdcdc)";

                        }


                        if (bg === "blue") {

                            document.body.style.background =
                                "linear-gradient(135deg,#183765,#0c1c35)";

                        }


                        backgroundMenu.classList.remove(
                            "show"
                        );

                    };

            }

        );


        /* =================================
           TELA CHEIA
        ================================= */

        document.getElementById(
            "fullscreenButton"
        ).onclick = function () {


            if (!document.fullscreenElement) {

                document.documentElement
                    .requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        };


        /* =================================
           RESIZE
        ================================= */

        window.addEventListener(

            "resize",

            function () {


                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );


        /* =================================
           ANIMAÇÃO
        ================================= */

        function animate() {


            requestAnimationFrame(
                animate
            );


            if (
                model &&
                automaticRotation
            ) {

                model.rotation.y +=
                    0.005;

            }


            controls.update();


            renderer.render(
                scene,
                camera
            );


        }


        animate();


    </script>


</body>

</html>
