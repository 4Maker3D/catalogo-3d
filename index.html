<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visualizador 3D</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            z-index: 10;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="info">
        <strong>Visualização 3D</strong><br>
        Arraste para girar • Pinça para zoom
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        import { STLLoader } from 'three/addons/loaders/STLLoader.js';


        // Cena
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0xf2f2f2);


        // Câmera
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 0, 100);


        // Renderizador
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        document.body.appendChild(renderer.domElement);


        // Controles
        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;


        // Iluminação
        const light1 = new THREE.DirectionalLight(
            0xffffff,
            3
        );

        light1.position.set(5, 10, 10);

        scene.add(light1);


        const light2 = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        light2.position.set(-5, -5, -10);

        scene.add(light2);


        const ambient = new THREE.AmbientLight(
            0xffffff,
            1
        );

        scene.add(ambient);


        // Carregar STL
        const loader = new STLLoader();

        loader.load(
            'Self-Watering-3.stl',

            function (geometry) {

                geometry.center();

                geometry.computeVertexNormals();

                const material = new THREE.MeshStandardMaterial({
                    color: 0x777777,
                    metalness: 0.1,
                    roughness: 0.65
                });

                const model = new THREE.Mesh(
                    geometry,
                    material
                );

                scene.add(model);


                // Ajusta automaticamente o tamanho
                const box = new THREE.Box3().setFromObject(model);

                const size = box.getSize(
                    new THREE.Vector3()
                );

                const maxDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                const scale = 50 / maxDimension;

                model.scale.setScalar(scale);

            },

            undefined,

            function (error) {

                console.error(
                    'Erro ao carregar STL:',
                    error
                );

                document.getElementById('info').innerHTML =
                    'Erro ao carregar o modelo 3D.';

            }
        );


        // Redimensionamento
        window.addEventListener(
            'resize',
            function () {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // Loop
        function animate() {

            requestAnimationFrame(animate);

            controls.update();

            renderer.render(
                scene,
                camera
            );

        }

        animate();

    </script>

</body>
</html>
