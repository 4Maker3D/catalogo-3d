<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4Maker 3D</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #f3f3f3;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        canvas {
            display: block;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        #header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 18px 22px;

            z-index: 20;

            pointer-events: none;
        }

        #brand {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #brand span {
            font-weight: normal;
            opacity: 0.55;
        }


        /* =========================
           INFORMAÇÕES DO PRODUTO
        ========================= */

        #productInfo {

            position: absolute;

            left: 22px;
            bottom: 22px;

            width: 330px;
            max-width: calc(100% - 44px);

            background: rgba(255,255,255,0.94);

            backdrop-filter: blur(10px);

            padding: 20px;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);

            z-index: 20;
        }

        #category {

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1.2px;

            opacity: 0.55;

            margin-bottom: 6px;
        }

        #productName {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        #description {

            font-size: 14px;

            line-height: 1.5;

            opacity: 0.75;

            margin-bottom: 15px;
        }

        .detail {

            font-size: 13px;

            margin-top: 6px;
        }

        .detail strong {

            font-weight: 600;
        }


        /* =========================
           BOTÃO WHATSAPP
        ========================= */

        #whatsapp {

            display: block;

            width: 100%;

            margin-top: 18px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            text-align: center;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #whatsapp:hover {

            transform: translateY(-1px);

            opacity: 0.9;
        }


        /* =========================
           CONTROLES
        ========================= */

        #controls {

            position: absolute;

            top: 22px;
            right: 22px;

            z-index: 20;

            display: flex;

            gap: 8px;
        }

        .controlButton {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 10px;

            background: rgba(255,255,255,0.92);

            box-shadow:
                0 5px 20px rgba(0,0,0,0.1);

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        .controlButton:hover {

            transform: translateY(-2px);
        }


        /* =========================
           INSTRUÇÕES
        ========================= */

        #instructions {

            position: absolute;

            top: 75px;
            right: 22px;

            z-index: 20;

            background: rgba(255,255,255,0.9);

            padding: 9px 12px;

            border-radius: 9px;

            font-size: 11px;

            opacity: 0.65;
        }


        /* =========================
           CARREGANDO
        ========================= */

        #loading {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 30;

            background: #f3f3f3;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #header {

                padding: 14px 16px;
            }

            #brand {

                font-size: 18px;
            }

            #controls {

                top: 14px;
                right: 14px;
            }

            #instructions {

                display: none;
            }

            #productInfo {

                left: 12px;
                bottom: 12px;

                width: calc(100% - 24px);

                padding: 16px;

                border-radius: 14px;
            }

            #productName {

                font-size: 20px;
            }

            #description {

                font-size: 13px;

                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CARREGAMENTO
    ========================= -->

    <div id="loading">

        Carregando modelo 3D...

    </div>


    <!-- =========================
         CABEÇALHO
    ========================= -->

    <div id="header">

        <div id="brand">

            4MAKER <span>3D</span>

        </div>

    </div>


    <!-- =========================
         CONTROLES
    ========================= -->

    <div id="controls">

        <button
            class="controlButton"
            id="resetButton"
            title="Centralizar modelo">

            ↺

        </button>


        <button
            class="controlButton"
            id="rotateButton"
            title="Rotação automática">

            ▶

        </button>


        <button
            class="controlButton"
            id="fullscreenButton"
            title="Tela cheia">

            ⛶

        </button>

    </div>


    <!-- =========================
         INSTRUÇÕES
    ========================= -->

    <div id="instructions">

        Arraste para girar • Pinça para aproximar

    </div>


    <!-- =========================
         INFORMAÇÕES
    ========================= -->

    <div id="productInfo">

        <div id="category">

            Plantas e decoração

        </div>


        <div id="productName">

            Self-Watering 3

        </div>


        <div id="description">

            Modelo disponível para produção personalizada.

        </div>


        <div class="detail">

            <strong>Materiais:</strong>

            PLA • PETG • ABS

        </div>


        <div class="detail">

            <strong>Personalização:</strong>

            Cores e tamanhos sob consulta

        </div>


        <a
            id="whatsapp"
            href="#"
            target="_blank">

            Solicitar orçamento

        </a>

    </div>


    <!-- =========================
         THREE.JS
    ========================= -->

    <script type="importmap">

    {
        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"

        }
    }

    </script>


    <script type="module">


        import * as THREE from 'three';

        import {
            OrbitControls
        } from 'three/addons/controls/OrbitControls.js';

        import {
            STLLoader
        } from 'three/addons/loaders/STLLoader.js';


        /* =========================
           CONFIGURAÇÃO DO PRODUTO
        ========================= */

        const produtos = {

            "Self-Watering-3": {

                nome: "Self-Watering 3",

                categoria: "Plantas e decoração",

                descricao:
                    "Modelo disponível para produção personalizada.",

                materiais:
                    "PLA • PETG • ABS"

            },


            "vaso-01": {

                nome: "Vaso Geométrico 01",

                categoria: "Plantas e decoração",

                descricao:
                    "Vaso decorativo com design exclusivo.",

                materiais:
                    "PLA • PETG • ABS"

            },


            "vaso-02": {

                nome: "Vaso Geométrico 02",

                categoria: "Plantas e decoração",

                descricao:
                    "Modelo decorativo disponível em diversas opções.",

                materiais:
                    "PLA • PETG • ABS"

            }

        };


        /* =========================
           IDENTIFICAR MODELO PELA URL
        ========================= */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        let modeloNome =
            parametros.get("modelo");


        if (!modeloNome) {

            modeloNome = "Self-Watering-3";

        }


        const produto =
            produtos[modeloNome] ||
            produtos["Self-Watering-3"];


        /* =========================
           ATUALIZAR INFORMAÇÕES
        ========================= */

        document.getElementById(
            "productName"
        ).textContent =
            produto.nome;


        document.getElementById(
            "category"
        ).textContent =
            produto.categoria;


        document.getElementById(
            "description"
        ).textContent =
            produto.descricao;


        document.querySelector(
            ".detail"
        ).innerHTML =
            "<strong>Materiais:</strong> " +
            produto.materiais;


        /* =========================
           WHATSAPP
        ========================= */

        const telefone =
            "5500000000000";


        const mensagem =
            "Olá! Gostaria de solicitar um orçamento para o modelo " +
            produto.nome;


        document.getElementById(
            "whatsapp"
        ).href =
            "https://wa.me/" +
            telefone +
            "?text=" +
            encodeURIComponent(mensagem);


        /* =========================
           CENA
        ========================= */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0xf3f3f3
            );


        /* =========================
           CÂMERA
        ========================= */

        const camera =
            new THREE.PerspectiveCamera(

                45,

                window.innerWidth /
                window.innerHeight,

                0.1,

                1000

            );


        camera.position.set(
            0,
            0,
            100
        );


        /* =========================
           RENDERIZADOR
        ========================= */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                alpha: true

            });


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(
                window.devicePixelRatio,
                2
            )

        );


        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        document.body.appendChild(
            renderer.domElement
        );


        /* =========================
           CONTROLES
        ========================= */

        const controls =
            new OrbitControls(

                camera,

                renderer.domElement

            );


        controls.enableDamping =
            true;


        controls.dampingFactor =
            0.06;


        controls.enablePan =
            false;


        /* =========================
           ILUMINAÇÃO
        ========================= */

        const keyLight =
            new THREE.DirectionalLight(

                0xffffff,

                4

            );


        keyLight.position.set(
            5,
            10,
            10
        );


        keyLight.castShadow =
            true;


        scene.add(
            keyLight
        );


        const fillLight =
            new THREE.DirectionalLight(

                0xffffff,

                2

            );


        fillLight.position.set(
            -10,
            5,
            5
        );


        scene.add(
            fillLight
        );


        const backLight =
            new THREE.DirectionalLight(

                0xffffff,

                2

            );


        backLight.position.set(
            0,
            5,
            -10
        );


        scene.add(
            backLight
        );


        const ambientLight =
            new THREE.AmbientLight(

                0xffffff,

                1.5

            );


        scene.add(
            ambientLight
        );


        /* =========================
           MODELO
        ========================= */

        let model = null;

        let originalRotation = null;

        let automaticRotation =
            false;


        const loader =
            new STLLoader();


        loader.load(

            modeloNome + ".stl",


            function (geometry) {


                geometry.computeVertexNormals();


                geometry.center();


                const material =
                    new THREE.MeshStandardMaterial({

                        color: 0x777777,

                        metalness: 0.05,

                        roughness: 0.6

                    });


                model =
                    new THREE.Mesh(

                        geometry,

                        material

                    );


                model.castShadow =
                    true;


                model.receiveShadow =
                    true;


                scene.add(
                    model
                );


                /* =====================
                   DIMENSIONAMENTO
                ===================== */

                const box =
                    new THREE.Box3()
                    .setFromObject(model);


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const maxDimension =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                const scale =
                    50 /
                    maxDimension;


                model.scale.setScalar(
                    scale
                );


                /* =====================
                   POSIÇÃO INICIAL
                ===================== */

                model.rotation.x =
                    0;


                model.rotation.y =
                    0;


                model.rotation.z =
                    0;


                originalRotation =
                    model.rotation.clone();


                /* =====================
                   CÂMERA
                ===================== */

                camera.position.set(
                    0,
                    0,
                    75
                );


                controls.target.set(
                    0,
                    0,
                    0
                );


                controls.update();


                document.getElementById(
                    "loading"
                ).style.display =
                    "none";


            },


            undefined,


            function (error) {

                console.error(
                    "Erro ao carregar STL:",
                    error
                );


                document.getElementById(
                    "loading"
                ).textContent =
                    "Não foi possível carregar o modelo.";

            }

        );


        /* =========================
           RESET
        ========================= */

        document.getElementById(
            "resetButton"
        ).addEventListener(

            "click",

            function () {

                if (!model)
                    return;


                model.rotation.copy(
                    originalRotation
                );


                controls.reset();

            }

        );


        /* =========================
           ROTAÇÃO AUTOMÁTICA
        ========================= */

        document.getElementById(
            "rotateButton"
        ).addEventListener(

            "click",

            function () {

                automaticRotation =
                    !automaticRotation;


                this.textContent =
                    automaticRotation
                    ? "Ⅱ"
                    : "▶";

            }

        );


        /* =========================
           TELA CHEIA
        ========================= */

        document.getElementById(
            "fullscreenButton"
        ).addEventListener(

            "click",

            function () {

                if (
                    !document.fullscreenElement
                ) {

                    document.documentElement
                        .requestFullscreen();

                } else {

                    document.exitFullscreen();

                }

            }

        );


        /* =========================
           REDIMENSIONAMENTO
        ========================= */

        window.addEventListener(

            "resize",

            function () {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );


        /* =========================
           ANIMAÇÃO
        ========================= */

        function animate() {

            requestAnimationFrame(
                animate
            );


            if (
                model &&
                automaticRotation
            ) {

                model.rotation.y +=
                    0.005;

            }


            controls.update();


            renderer.render(
                scene,
                camera
            );

        }


        animate();


    </script>

</body>

</html>
