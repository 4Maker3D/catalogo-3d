<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>4Maker 3D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f5f7;

    color: #202124;
}


/* =========================
   ÁREA 3D
========================= */

#viewer {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;
}


canvas {

    display: block;

    width: 100%;
    height: 100%;

    touch-action: none;
}


/* =========================
   CABEÇALHO
========================= */

#header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 76px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        12px
        20px;

    background:
        rgba(25, 62, 108, 0.96);

    z-index: 20;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.10);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


/* =========================
   MARCA
========================= */

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    color: white;
}


.brand img {

    height: 48px;

    width: auto;

    object-fit: contain;

    background: white;

    border-radius: 8px;
}


.brand-text {

    font-size: 19px;

    font-weight: 600;

    letter-spacing: 1px;
}


.brand-text span {

    font-weight: 300;

    opacity: 0.8;
}


/* =========================
   CONTROLES
========================= */

#controls {

    display: flex;

    gap: 8px;
}


.control-button {

    width: 48px;
    height: 48px;

    padding: 0;

    border: none;

    border-radius: 13px;

    background:
        rgba(255,255,255,0.96);

    color: #193e6c;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(0,0,0,0.10);

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
}


/*
   Área interna do ícone.

   O SVG fica exatamente
   centralizado dentro dela.
*/

.control-button .icon {

    width: 23px;
    height: 23px;

    display: flex;

    align-items: center;
    justify-content: center;

    line-height: 0;

    flex-shrink: 0;
}


.control-button .icon svg {

    width: 100%;
    height: 100%;

    display: block;
}


.control-button:active {

    transform:
        scale(0.92);
}


.control-button:hover {

    background: white;
}


/*
   Estado ativo
*/

.control-button.active {

    background: #193e6c;

    color: white;
}


/* =========================
   CARD DO PRODUTO
========================= */

#product-card {

    position: fixed;

    left: 50%;

    bottom: 22px;

    transform:
        translateX(-50%);

    width:
        min(
            560px,
            calc(100% - 32px)
        );

    padding:
        25px
        28px
        27px;

    background:
        rgba(255,255,255,0.96);

    border-radius: 24px;

    z-index: 15;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.15);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    transition:
        background 0.3s ease,
        color 0.3s ease;
}


/* =========================
   INDICADOR DE ROLAGEM
========================= */

.scroll-indicator {

    position: absolute;

    right: 7px;

    bottom: 7px;

    width: 38px;
    height: 48px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding-bottom: 4px;

    border-radius: 18px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0.96) 48%
        );

    color: #193e6c;

    font-size: 25px;

    pointer-events: none;

    opacity: 1;

    transition:
        opacity 0.3s ease;

    z-index: 3;
}


.scroll-indicator span {

    animation:
        scrollHint
        1.5s
        ease-in-out
        infinite;
}


.scroll-indicator.hidden {

    opacity: 0;
}


@keyframes scrollHint {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(5px);

    }

}


/* =========================
   INFORMAÇÕES
========================= */

.category {

    color: #193e6c;

    font-size: 13px;

    font-weight: 600;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 8px;
}


.product-name {

    font-size: 29px;

    line-height: 1.15;

    margin-bottom: 12px;

    font-weight: 500;
}


.description {

    color: #666;

    font-size: 16px;

    line-height: 1.45;

    margin-bottom: 17px;
}


.info-line {

    font-size: 16px;

    margin-top: 8px;

    line-height: 1.45;
}


.info-line strong {

    font-weight: 600;
}


/* =========================
   CORES
========================= */

.color-title {

    font-size: 15px;

    margin-top: 18px;

    margin-bottom: 9px;

    font-weight: 500;
}


.colors {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    flex-wrap: wrap;
}


.color {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 2px solid #d5d5d5;

    cursor: pointer;

    position: relative;

    transition:
        transform 0.15s ease,
        border 0.15s ease;
}


.color.selected {

    border:
        3px solid #193e6c;

    transform:
        scale(1.08);
}


.color:active {

    transform:
        scale(0.94);
}


/* =========================
   BOTÃO ORÇAMENTO
========================= */

.quote-button {

    width: 100%;

    min-height: 56px;

    border: none;

    border-radius: 15px;

    background: #193e6c;

    color: white;

    font-size: 17px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}


.quote-button:active {

    transform:
        scale(0.98);
}


.quote-button:hover {

    opacity: 0.92;
}


/* =========================
   CARREGANDO
========================= */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 10;

    padding:
        12px
        18px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.9);

    color: #333;

    font-size: 14px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);
}


/* =========================
   MODO ESCURO
========================= */

body.dark #product-card {

    background:
        rgba(28,30,34,0.94);

    color: white;
}


body.dark .description {

    color: #b8b8b8;
}


body.dark .category {

    color: #8eb4e5;
}


body.dark .color-title {

    color: #ddd;
}


body.dark .scroll-indicator {

    background:
        linear-gradient(
            to bottom,
            rgba(28,30,34,0),
            rgba(28,30,34,0.96) 48%
        );

    color: #8eb4e5;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

    #header {

        height: 68px;

        padding:
            9px
            12px;
    }


    .brand img {

        height: 43px;
    }


    .brand-text {

        display: none;
    }


    #controls {

        gap: 6px;
    }


    .control-button {

        width: 43px;
        height: 43px;

        border-radius: 12px;
    }


    .control-button .icon {

        width: 21px;
        height: 21px;
    }


    /*
       O card permanece
       limitado a 18vh.
    */

    #product-card {

        left: 12px;
        right: 12px;

        bottom: 12px;

        transform: none;

        width: auto;

        padding:
            20px
            20px
            21px;

        border-radius: 21px;

        max-height: 18vh;

        overflow-y: auto;

        scrollbar-width: none;

        -ms-overflow-style: none;
    }


    #product-card::-webkit-scrollbar {

        display: none;
    }


    .category {

        font-size: 12px;

        letter-spacing: 1.7px;
    }


    .product-name {

        font-size: 27px;
    }


    .description {

        font-size: 15px;

        margin-bottom: 14px;
    }


    .info-line {

        font-size: 15px;
    }


    .color {

        width: 39px;
        height: 39px;
    }


    .quote-button {

        min-height: 53px;

        font-size: 16px;
    }


    .scroll-indicator {

        right: 5px;

        bottom: 5px;

        width: 35px;
        height: 45px;

        font-size: 23px;
    }

}

</style>

</head>


<body>

<div id="viewer"></div>


<!-- =========================
     CABEÇALHO
========================= -->

<header id="header">

    <div class="brand">

        <img
            src="logo.png"
            alt="4Maker 3D">

        <div class="brand-text">

            4MAKER
            <span>3D</span>

        </div>

    </div>


    <div id="controls">


        <!-- CENTRALIZAR -->

        <button
            class="control-button"
            id="resetButton"
            title="Centralizar"
            aria-label="Centralizar">

            <span class="icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path
                        d="M12 5v14M5 12h14"/>

                    <circle
                        cx="12"
                        cy="12"
                        r="8"/>

                </svg>

            </span>

        </button>


        <!-- ROTAÇÃO AUTOMÁTICA -->

        <button
            class="control-button"
            id="autoButton"
            title="Rotação automática"
            aria-label="Rotação automática">

            <span class="icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    id="autoIcon">

                    <path
                        d="M8 5v14l11-7z"/>

                </svg>

            </span>

        </button>


        <!-- AMBIENTE -->

        <button
            class="control-button"
            id="environmentButton"
            title="Ambiente: Claro"
            aria-label="Mudar ambiente">

            <span class="icon"
                  id="environmentIcon">

                <!-- Ícone SOL -->

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round">

                    <circle
                        cx="12"
                        cy="12"
                        r="4"/>

                    <path d="M12 2v2"/>
                    <path d="M12 20v2"/>
                    <path d="M4.93 4.93l1.41 1.41"/>
                    <path d="M17.66 17.66l1.41 1.41"/>
                    <path d="M2 12h2"/>
                    <path d="M20 12h2"/>
                    <path d="M4.93 19.07l1.41-1.41"/>
                    <path d="M17.66 6.34l1.41-1.41"/>

                </svg>

            </span>

        </button>


        <!-- TELA CHEIA -->

        <button
            class="control-button"
            id="fullscreenButton"
            title="Tela cheia"
            aria-label="Tela cheia">

            <span class="icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                    <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

                </svg>

            </span>

        </button>


    </div>

</header>


<div id="loading">

    Carregando modelo 3D...

</div>


<!-- =========================
     PRODUTO
========================= -->

<section id="product-card">


    <!-- INDICADOR DE ROLAGEM -->

    <div
        class="scroll-indicator"
        id="scrollIndicator">

        <span>↓</span>

    </div>


    <div
        class="category"
        id="category">

        PLANTAS E DECORAÇÃO

    </div>


    <div
        class="product-name"
        id="productName">

        Self-Watering 3

    </div>


    <div
        class="description"
        id="description">

        Modelo disponível para produção
        personalizada.

    </div>


    <div class="info-line">

        <strong>Materiais:</strong>

        <span id="materials">

            PLA • PETG • ABS

        </span>

    </div>


    <div class="info-line">

        <strong>Personalização:</strong>

        <span id="customization">

            Cores e tamanhos sob consulta

        </span>

    </div>


    <div class="color-title">

        Cores disponíveis

    </div>


    <div
        class="colors"
        id="colors">

    </div>


    <button
        class="quote-button"
        id="quoteButton">

        Solicitar orçamento

    </button>

</section>


<!-- =========================
     THREE.JS
========================= -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE from 'three';

import {
    OrbitControls
}
from 'three/addons/controls/OrbitControls.js';

import {
    STLLoader
}
from 'three/addons/loaders/STLLoader.js';

import {
    RGBELoader
}
from 'three/addons/loaders/RGBELoader.js';


/* =====================================================
   CONFIGURAÇÃO DOS PRODUTOS
===================================================== */

const products = {

    "Self-Watering-3": {

        name:
            "Self-Watering 3",

        category:
            "PLANTAS E DECORAÇÃO",

        description:
            "Modelo disponível para produção personalizada.",

        materials:
            "PLA • PETG • ABS",

        customization:
            "Cores e tamanhos sob consulta",

        colors: [

            {
                name:
                    "Branco",

                hex:
                    0xf5f5f5
            },

            {
                name:
                    "Preto",

                hex:
                    0x252525
            },

            {
                name:
                    "Azul",

                hex:
                    0x214779
            },

            {
                name:
                    "Vermelho",

                hex:
                    0xdd3030
            },

            {
                name:
                    "Amarelo",

                hex:
                    0xd6a51b
            },

            {
                name:
                    "Verde",

                hex:
                    0x3c985c
            }

        ]

    }

};


/* =====================================================
   IDENTIFICA O MODELO PELA URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let modelName =
    params.get("modelo") ||
    "Self-Watering-3";


modelName =
    modelName.replace(
        /\.stl$/i,
        ""
    );


const product =
    products[modelName] ||
    products["Self-Watering-3"];


/* =====================================================
   PREENCHER INTERFACE
===================================================== */

document
    .getElementById("productName")
    .textContent =
        product.name;


document
    .getElementById("category")
    .textContent =
        product.category;


document
    .getElementById("description")
    .textContent =
        product.description;


document
    .getElementById("materials")
    .textContent =
        product.materials;


document
    .getElementById("customization")
    .textContent =
        product.customization;


/* =====================================================
   CENA
===================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0xf4f5f7
    );


/* =====================================================
   CÂMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.01,

        5000

    );


camera.position.set(
    0,
    0,
    100
);


/* =====================================================
   RENDERIZADOR
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:
            true,

        alpha:
            false

    });


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


/*
   Sombras desligadas.
*/

renderer.shadowMap.enabled =
    false;


document
    .getElementById("viewer")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   CONTROLES
===================================================== */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.07;


controls.enableZoom =
    true;


controls.enablePan =
    true;


controls.touches.ONE =
    THREE.TOUCH.ROTATE;


controls.touches.TWO =
    THREE.TOUCH.DOLLY_PAN;


controls.mouseButtons.LEFT =
    THREE.MOUSE.ROTATE;


controls.mouseButtons.RIGHT =
    THREE.MOUSE.PAN;


controls.mouseButtons.MIDDLE =
    THREE.MOUSE.DOLLY;


/* =====================================================
   ILUMINAÇÃO
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        2.2
    );

scene.add(
    ambient
);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3.5
    );


keyLight.position.set(
    5,
    10,
    8
);


scene.add(
    keyLight
);


const fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.8
    );


fillLight.position.set(
    -6,
    4,
    -5
);


scene.add(
    fillLight
);


/* =====================================================
   MODELO
===================================================== */

let model =
    null;


let originalMaterialColor =
    0x777777;


let modelScale =
    1;


/* =====================================================
   CENTRALIZAR MODELO
===================================================== */

function centerModel() {

    if (!model)
        return;


    const box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    model.position.sub(
        center
    );


    const newBox =
        new THREE.Box3()
            .setFromObject(
                model
            );


    const size =
        newBox.getSize(
            new THREE.Vector3()
        );


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const distance =
        maxDimension * 1.9;


    camera.position.set(
        0,
        maxDimension * 0.15,
        distance
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();

}


/* =====================================================
   CARREGAR STL
===================================================== */

const loader =
    new STLLoader();


const stlPath =
    modelName +
    ".stl";


loader.load(

    stlPath,


    function(geometry) {

        geometry.computeVertexNormals();

        geometry.center();


        const material =
            new THREE.MeshStandardMaterial({

                color:
                    originalMaterialColor,

                metalness:
                    0.05,

                roughness:
                    0.58

            });


        model =
            new THREE.Mesh(
                geometry,
                material
            );


        scene.add(
            model
        );


        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        const maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        /*
           Escala atual mantida.
        */

        modelScale =
            57 /
            maxDimension;


        model.scale.setScalar(
            modelScale
        );


        centerModel();


        document
            .getElementById("loading")
            .style.display =
                "none";


        setTimeout(
            updateScrollIndicator,
            100
        );

    },


    undefined,


    function(error) {

        console.error(
            "Erro ao carregar STL:",
            error
        );


        document
            .getElementById("loading")
            .textContent =
                "Não foi possível carregar o modelo.";

    }

);


/* =====================================================
   CORES
===================================================== */

const colorsContainer =
    document.getElementById(
        "colors"
    );


product.colors.forEach(

    (colorData, index) => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "color";


        button.title =
            colorData.name;


        button.setAttribute(
            "aria-label",
            colorData.name
        );


        button.style.background =
            "#" +
            colorData.hex
                .toString(16)
                .padStart(
                    6,
                    "0"
                );


        if (index === 0) {

            button.classList.add(
                "selected"
            );

        }


        button.addEventListener(
            "click",
            function() {

                if (!model)
                    return;


                model.material.color.setHex(
                    colorData.hex
                );


                document
                    .querySelectorAll(
                        ".color"
                    )
                    .forEach(
                        item =>
                            item.classList.remove(
                                "selected"
                            )
                    );


                button.classList.add(
                    "selected"
                );

            }
        );


        colorsContainer.appendChild(
            button
        );

    }

);


/* =====================================================
   AMBIENTES
===================================================== */

let environmentMode =
    0;


/*
   0 = Claro
   1 = Escuro
   2 = Estúdio HDRI
   3 = 4Maker
*/


const environments = [

    {
        name:
            "Claro",

        background:
            0xf4f5f7,

        hdr:
            false
    },


    {
        name:
            "Escuro",

        background:
            0x17191d,

        hdr:
            false
    },


    {
        name:
            "Estúdio",

        background:
            null,

        hdr:
            true
    },


    {
        name:
            "4Maker",

        background:
            0x193e6c,

        hdr:
            false
    }

];


let studioEnvironment =
    null;


/* =====================================================
   HDRI — FALLBACK 4K → 2K → 1K
===================================================== */

const HDRI_4K =
    "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/brown_photostudio_02_4k.hdr";


const HDRI_2K =
    "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/brown_photostudio_02_2k.hdr";


const HDRI_1K =
    "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/brown_photostudio_02_1k.hdr";


const rgbeLoader =
    new RGBELoader();


/*
   Aplica o HDRI caso o usuário
   esteja no modo Estúdio.
*/

function applyStudioEnvironment() {

    if (
        environmentMode !== 2
    )
        return;


    if (
        studioEnvironment
    ) {

        scene.background =
            studioEnvironment;

        scene.environment =
            studioEnvironment;

    }

    else {

        /*
           Fundo neutro enquanto
           o HDRI ainda carrega.

           Nunca deixa a tela preta.
        */

        scene.background =
            new THREE.Color(
                0xf4f5f7
            );

        scene.environment =
            null;

    }

}


/*
   Carregamento sequencial:

       4K
        ↓
       2K
        ↓
       1K
        ↓
       nenhum
*/

function loadHDRIChain() {

    rgbeLoader.load(

        HDRI_4K,


        function(texture) {

            texture.mapping =
                THREE.EquirectangularReflectionMapping;


            studioEnvironment =
                texture;


            console.log(
                "HDRI 4K carregado."
            );


            applyStudioEnvironment();

        },


        undefined,


        function() {

            console.warn(
                "HDRI 4K falhou. Tentando 2K..."
            );


            rgbeLoader.load(

                HDRI_2K,


                function(texture) {

                    texture.mapping =
                        THREE.EquirectangularReflectionMapping;


                    studioEnvironment =
                        texture;


                    console.log(
                        "HDRI 2K carregado."
                    );


                    applyStudioEnvironment();

                },


                undefined,


                function() {

                    console.warn(
                        "HDRI 2K falhou. Tentando 1K..."
                    );


                    rgbeLoader.load(

                        HDRI_1K,


                        function(texture) {

                            texture.mapping =
                                THREE.EquirectangularReflectionMapping;


                            studioEnvironment =
                                texture;


                            console.log(
                                "HDRI 1K carregado."
                            );


                            applyStudioEnvironment();

                        },


                        undefined,


                        function() {

                            console.warn(
                                "HDRI 1K também falhou."
                            );


                            /*
                               Nenhum HDRI disponível.
                            */

                            if (
                                environmentMode === 2
                            ) {

                                scene.background =
                                    new THREE.Color(
                                        0xf4f5f7
                                    );

                                scene.environment =
                                    null;

                            }

                        }

                    );

                }

            );

        }

    );

}


loadHDRIChain();


/* =====================================================
   ÍCONES DOS AMBIENTES
===================================================== */

const environmentIcon =
    document.getElementById(
        "environmentIcon"
    );


function getEnvironmentIcon(
    mode
) {

    /*
       CLARO — SOL
    */

    if (
        mode === 0
    ) {

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round">

                <circle
                    cx="12"
                    cy="12"
                    r="4"/>

                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/>
                <path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="M4.93 19.07l1.41-1.41"/>
                <path d="M17.66 6.34l1.41-1.41"/>

            </svg>

        `;

    }


    /*
       ESCURO — LUA / MEIA-LUA
    */

    if (
        mode === 1
    ) {

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path
                    d="M21 12.8A8.5 8.5 0 1 1 11.2 3
                       A6.5 6.5 0 0 0 21 12.8Z"/>

            </svg>

        `;

    }


    /*
       ESTÚDIO — ESTRELA
    */

    if (
        mode === 2
    ) {

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path
                    d="M12 3
                       L13.8 9.2
                       L20 11
                       L13.8 12.8
                       L12 19
                       L10.2 12.8
                       L4 11
                       L10.2 9.2
                       Z"/>

            </svg>

        `;

    }


    /*
       4MAKER — DIAMANTE
    */

    return `

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round">

            <path
                d="M12 3
                   L21 12
                   L12 21
                   L3 12
                   Z"/>

        </svg>

    `;

}


/* =====================================================
   ALTERAR AMBIENTE
===================================================== */

function updateEnvironment() {

    const env =
        environments[
            environmentMode
        ];


    /*
       Atualiza o ícone
       do único botão.
    */

    environmentIcon.innerHTML =
        getEnvironmentIcon(
            environmentMode
        );


    /*
       Atualiza título
       e acessibilidade.
    */

    const environmentButton =
        document.getElementById(
            "environmentButton"
        );


    environmentButton.title =
        "Ambiente: " +
        env.name;


    environmentButton.setAttribute(
        "aria-label",
        "Ambiente: " +
        env.name
    );


    /*
       HDRI
    */

    if (
        env.hdr
    ) {

        applyStudioEnvironment();

    }


    /*
       Ambientes normais.
    */

    else {

        scene.background =
            new THREE.Color(
                env.background
            );


        scene.environment =
            null;

    }


    /*
       Modo escuro.
    */

    if (
        environmentMode === 1
    ) {

        document.body.classList.add(
            "dark"
        );

    }

    else {

        document.body.classList.remove(
            "dark"
        );

    }

}


updateEnvironment();


/* =====================================================
   BOTÃO AMBIENTE
===================================================== */

document
    .getElementById(
        "environmentButton"
    )
    .addEventListener(
        "click",
        function() {

            environmentMode++;


            if (
                environmentMode >=
                environments.length
            ) {

                environmentMode =
                    0;

            }


            updateEnvironment();

        }
    );


/* =====================================================
   ROTAÇÃO AUTOMÁTICA
===================================================== */

let autoRotate =
    false;


const autoIcon =
    document.getElementById(
        "autoIcon"
    );


document
    .getElementById(
        "autoButton"
    )
    .addEventListener(
        "click",
        function() {

            autoRotate =
                !autoRotate;


            /*
               Play
            */

            if (
                autoRotate
            ) {

                autoIcon.innerHTML = `

                    <path
                        d="M6 4h4v16H6z"/>

                    <path
                        d="M14 4h4v16h-4z"/>

                `;

            }


            /*
               Pause → Play
            */

            else {

                autoIcon.innerHTML = `

                    <path
                        d="M8 5v14l11-7z"/>

                `;

            }


            this.classList.toggle(
                "active",
                autoRotate
            );

        }
    );


/* =====================================================
   CENTRALIZAR
===================================================== */

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        function() {

            centerModel();

        }
    );


/* =====================================================
   TELA CHEIA
===================================================== */

document
    .getElementById(
        "fullscreenButton"
    )
    .addEventListener(
        "click",
        async function() {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch(error) {

                console.warn(
                    "Tela cheia não disponível.",
                    error
                );

            }

        }
    );


/* =====================================================
   WHATSAPP
===================================================== */

const WHATSAPP_NUMBER =
    "5531982587603";


document
    .getElementById(
        "quoteButton"
    )
    .addEventListener(
        "click",
        function() {

            const message =
                encodeURIComponent(

                    "Olá! Gostaria de solicitar " +
                    "um orçamento para o modelo " +
                    product.name +
                    "."

                );


            if (
                WHATSAPP_NUMBER
            ) {

                window.open(

                    "https://wa.me/" +
                    WHATSAPP_NUMBER +
                    "?text=" +
                    message,

                    "_blank"

                );

            }

            else {

                window.open(

                    "https://wa.me/?text=" +
                    message,

                    "_blank"

                );

            }

        }
    );


/* =====================================================
   INDICADOR DE ROLAGEM
===================================================== */

const productCard =
    document.getElementById(
        "product-card"
    );


const scrollIndicator =
    document.getElementById(
        "scrollIndicator"
    );


function updateScrollIndicator() {

    const hasScroll =
        productCard.scrollHeight >
        productCard.clientHeight +
        5;


    const atBottom =
        productCard.scrollTop +
        productCard.clientHeight >=
        productCard.scrollHeight -
        5;


    if (
        !hasScroll ||
        atBottom
    ) {

        scrollIndicator.classList.add(
            "hidden"
        );

    }

    else {

        scrollIndicator.classList.remove(
            "hidden"
        );

    }

}


productCard.addEventListener(
    "scroll",
    updateScrollIndicator
);


window.addEventListener(
    "resize",
    updateScrollIndicator
);


setTimeout(
    updateScrollIndicator,
    300
);


/* =====================================================
   REDIMENSIONAMENTO
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        updateScrollIndicator();

    }
);


/* =====================================================
   ANIMAÇÃO
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        autoRotate &&
        model
    ) {

        model.rotation.y +=
            0.005;

    }


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>

</html>
